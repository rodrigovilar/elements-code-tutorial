# Docker setup for Liquid Testnet
# https://liquidtestnet.com/
#
# This connects two Elements nodes to the public Liquid Testnet

services:
  # Elements Node 1 - Connected to Liquid Testnet
  elementsd1:
    image: blockstream/elementsd:latest
    container_name: tutorial_elementsd1
    volumes:
      - ./elementsdir1:/root/.elements
    ports:
      - "18884:18884"  # RPC
      - "18886:18886"  # P2P
    networks:
      - elements_network
    restart: unless-stopped
    command: elementsd -chain=liquidtestnet
    healthcheck:
      test: ["CMD", "elements-cli", "-chain=liquidtestnet", "-rpcuser=user1", "-rpcpassword=password1", "getblockchaininfo"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Elements Node 2 - Connected to Liquid Testnet
  elementsd2:
    image: blockstream/elementsd:latest
    container_name: tutorial_elementsd2
    volumes:
      - ./elementsdir2:/root/.elements
    ports:
      - "18885:18885"  # RPC
      - "18887:18887"  # P2P
    networks:
      - elements_network
    restart: unless-stopped
    command: elementsd -chain=liquidtestnet
    healthcheck:
      test: ["CMD", "elements-cli", "-chain=liquidtestnet", "-rpcuser=user2", "-rpcpassword=password2", "getblockchaininfo"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  elements_network:
    driver: bridge
